name: Android build

on:
  push:
    branches:
      - codex/beatbox-android-reconstruction
  pull_request:
    branches:
      - main
      - master
      - codex/beatbox-android-reconstruction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test debug app
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licences
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: beatbox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
