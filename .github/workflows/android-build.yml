name: Android build

on:
  push:
    branches:
      - codex/beatbox-android-reconstruction
  pull_request:
    branches:
      - main
      - master
      - codex/beatbox-android-reconstruction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licences
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v6

      - name: Clean build outputs
        run: ./gradlew --no-daemon clean

      - name: Run JVM unit tests
        run: set -o pipefail; ./gradlew --no-daemon testDebugUnitTest --stacktrace 2>&1 | tee gradle-test-debug.log

      - name: Surface JVM test failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gradle-test-debug.log')
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              selected = []
              cause_count = 0
              for index, line in enumerate(lines):
                  if '* What went wrong:' in line or 'FAILURE: Build failed' in line:
                      selected.extend(lines[index:index + 18])
                  elif line.lstrip().startswith('Caused by:') and cause_count < 3:
                      selected.extend(lines[index:index + 5])
                      cause_count += 1
              message = '\n'.join(selected or lines[-45:])[-5000:]
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Gradle JVM test diagnostics::{escaped}')
          PY

      - name: Run Android lint
        run: set -o pipefail; ./gradlew --no-daemon lintDebug --stacktrace 2>&1 | tee gradle-lint.log

      - name: Surface lint failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gradle-lint.log')
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              selected = []
              cause_count = 0
              for index, line in enumerate(lines):
                  if '* What went wrong:' in line or 'FAILURE: Build failed' in line:
                      selected.extend(lines[index:index + 18])
                  elif line.lstrip().startswith('Caused by:') and cause_count < 3:
                      selected.extend(lines[index:index + 5])
                      cause_count += 1
              message = '\n'.join(selected or lines[-45:])[-5000:]
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Gradle lint diagnostics::{escaped}')
          PY

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Summarize local test results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/**/*.xml', recursive=True)
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for path in files:
              try:
                  root = ET.parse(path).getroot()
                  for key in totals:
                      totals[key] += int(root.attrib.get(key, 0))
              except (ET.ParseError, OSError):
                  pass
          print('### JVM unit tests')
          if not files:
              print('No JVM test result XML was produced.')
          else:
              print(f"{totals['tests']} tests; {totals['failures']} failures; {totals['errors']} errors; {totals['skipped']} skipped.")
          PY

      - name: Upload build and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: beatbox-build-reports
          path: |
            gradle-lint.log
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: beatbox-gradle-diagnostics
          path: |
            gradle-test-debug.log
            gradle-lint.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: beatbox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-tests:
    name: Android emulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licences
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run instrumented tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          pre-emulator-launch-script: |
            printf 'Pre-launch diagnostics started at %s\n' "$(date -Is)" > emulator-boot-diagnostics.log
            echo "ADB state before emulator launch:" >> emulator-boot-diagnostics.log
            adb devices -l >> emulator-boot-diagnostics.log 2>&1 || true
          script: |
            echo "--- Emulator boot state before tests ---" >> emulator-boot-diagnostics.log
            timeout 10s adb devices -l >> emulator-boot-diagnostics.log 2>&1 || echo "ADB device listing timed out or failed" >> emulator-boot-diagnostics.log
            echo "boot_completed=$(timeout 10s adb -s emulator-5554 shell getprop sys.boot_completed 2>&1)" >> emulator-boot-diagnostics.log
            echo "boot_animation=$(timeout 10s adb -s emulator-5554 shell getprop init.svc.bootanim 2>&1)" >> emulator-boot-diagnostics.log
            timeout 10s adb shell input keyevent KEYCODE_WAKEUP || true
            timeout 10s adb shell wm dismiss-keyguard || true
            ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace > gradle-connected-tests.log 2>&1; test_status=$?; cat gradle-connected-tests.log; echo "Gradle instrumentation exit code: $test_status" >> emulator-device-diagnostics.log; timeout 10s adb devices -l >> emulator-device-diagnostics.log 2>&1 || echo "ADB device listing timed out or failed" >> emulator-device-diagnostics.log; echo "boot_completed=$(timeout 10s adb -s emulator-5554 shell getprop sys.boot_completed 2>&1)" >> emulator-device-diagnostics.log; echo "boot_animation=$(timeout 10s adb -s emulator-5554 shell getprop init.svc.bootanim 2>&1)" >> emulator-device-diagnostics.log; timeout 15s adb -s emulator-5554 logcat -d -b all -v threadtime '*:W' > emulator-logcat-warnings.txt 2>&1 || echo "Logcat capture timed out or failed" >> emulator-logcat-warnings.txt; exit "$test_status"

      - name: Capture emulator diagnostics
        if: always()
        run: |
          {
            echo "--- ADB devices ---"
            timeout 10s adb devices -l || echo "ADB device listing timed out or failed"
            echo "--- Emulator state ---"
            timeout 10s adb -s emulator-5554 get-state || echo "Emulator state query timed out or failed"
            echo "--- Boot complete ---"
            timeout 10s adb -s emulator-5554 shell getprop sys.boot_completed || echo "boot-state query timed out or failed"
            echo "--- Boot animation ---"
            timeout 10s adb -s emulator-5554 shell getprop init.svc.bootanim || echo "boot-animation query timed out or failed"
            echo "--- Emulator processes ---"
            ps -ef | grep -E '[q]emu|[e]mulator'
          } >> emulator-device-diagnostics.log 2>&1 || true
          timeout 15s adb -s emulator-5554 logcat -d -b all -v threadtime '*:W' > emulator-logcat-warnings.txt 2>&1 || echo "Logcat capture timed out or failed" >> emulator-logcat-warnings.txt

      - name: Surface emulator failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob
          import xml.etree.ElementTree as ET
          path = Path('gradle-connected-tests.log')
          selected = []
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              cause_count = 0
              for index, line in enumerate(lines):
                  if '* What went wrong:' in line or 'FAILURE: Build failed' in line:
                      selected.extend(lines[index:index + 18])
                  elif line.lstrip().startswith('Caused by:') and cause_count < 3:
                      selected.extend(lines[index:index + 5])
                      cause_count += 1
              message = '\n'.join(selected or lines[-45:])[-3500:]
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Emulator test diagnostics::{escaped}')
          report_files = glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          report_files += glob.glob('app/build/reports/androidTests/connected/**/*.xml', recursive=True)
          failures = []
          for report in report_files:
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError):
                  continue
              for case in root.iter('testcase'):
                  for result in list(case):
                      if result.tag in ('failure', 'error'):
                          name = f"{case.attrib.get('classname', 'test')}#{case.attrib.get('name', 'unknown')}"
                          detail = result.attrib.get('message', '').strip()
                          if result.text and result.text.strip():
                              detail += '\n' + result.text.strip()[:800]
                          failures.append(f'{name}: {detail[:1200]}')
          if failures:
              message = '\n'.join(failures[:12])[:4500]
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Android instrumented test failures::{escaped}')
          diagnostics = Path('emulator-device-diagnostics.log')
          if diagnostics.exists():
              message = diagnostics.read_text(errors='replace')[-2500:]
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Emulator device and boot state::{escaped}')
          logcat = Path('emulator-logcat-warnings.txt')
          if logcat.exists():
              lines = logcat.read_text(errors='replace').splitlines()
              selected = [line for line in lines if any(term in line for term in ('AndroidRuntime', 'FATAL EXCEPTION', 'am_crash', 'Media3', 'ExoPlayer', 'SQLite', 'Permission Denial'))]
              message = '\n'.join(selected[-30:])[-2500:]
              if message:
                  escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Android warning and crash logcat::{escaped}')
          PY

      - name: Summarize emulator test results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          files += glob.glob('app/build/reports/androidTests/connected/**/*.xml', recursive=True)
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for path in set(files):
              try:
                  root = ET.parse(path).getroot()
              except (ET.ParseError, OSError):
                  continue
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print('### API 35 emulator tests')
          if not files:
              print('No instrumented test result XML was produced.')
          else:
              print(f"{totals['tests']} tests; {totals['failures']} failures; {totals['errors']} errors; {totals['skipped']} skipped.")
          PY

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: beatbox-emulator-test-reports
          path: |
            gradle-connected-tests.log
            emulator-boot-diagnostics.log
            emulator-device-diagnostics.log
            emulator-logcat-warnings.txt
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
